<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BatStateU Reviewer Suite • Academic Portal</title>
  <meta name="description" content="Minimalist, mobile-first academic review portal for BatStateU 3rd Year courses: GEd 104, IT 321, and CS 312.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', -apple-system, 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            serif: ['Newsreader', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            brand: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              300: '#d4d4d8',
              400: '#a1a1aa',
              500: '#71717a',
              600: '#52525b',
              700: '#3f3f46',
              800: '#27272a',
              900: '#18181b',
              950: '#09090b',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen flex font-sans antialiased selection:bg-zinc-200 dark:selection:bg-zinc-800">

  <!-- ==========================================
       MOBILE SIDEBAR OVERLAY BACKDROP
       ========================================== -->
  <div id="sidebar-backdrop" onclick="UNIFIED_ROUTER.closeMobileSidebar()" class="sidebar-overlay hidden md:hidden"></div>

  <!-- ==========================================
       1. PERSISTENT SIDEBAR ACCORDION
       ========================================== -->
  <aside
    id="app-sidebar"
    class="fixed inset-y-0 left-0 z-50 w-72 md:w-64 bg-white/95 dark:bg-zinc-900/95 md:bg-white md:dark:bg-zinc-900 border-r border-zinc-200/80 dark:border-zinc-800/80 flex flex-col transition-transform duration-250 ease-out -translate-x-full md:translate-x-0"
  >
    <!-- Sidebar Header -->
    <div class="h-14 px-4 flex items-center justify-between border-b border-zinc-200/70 dark:border-zinc-800/70">
      <div class="flex items-center gap-2.5 min-w-0 cursor-pointer" onclick="UNIFIED_ROUTER.backToLanding()">
        <div class="w-7 h-7 rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 flex items-center justify-center font-mono font-bold text-xs shrink-0">
          3Y
        </div>
        <div class="truncate">
          <span class="font-serif font-bold text-sm tracking-tight text-zinc-900 dark:text-zinc-100 block leading-none">Reviewer</span>
          <span class="text-[10px] font-mono text-zinc-400 block pt-0.5">BatStateU CICS</span>
        </div>
      </div>
      <!-- Close Button (Mobile Only) -->
      <button
        onclick="UNIFIED_ROUTER.closeMobileSidebar()"
        class="md:hidden p-1.5 rounded-lg text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 touch-target flex items-center justify-center"
        aria-label="Close menu"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Tree Navigation Container (Populated dynamically) -->
    <nav id="sidebar-tree" class="flex-1 overflow-y-auto px-2 py-3 space-y-1.5 text-xs select-none"></nav>

    <!-- Sidebar Footer -->
    <div class="p-3 border-t border-zinc-200/70 dark:border-zinc-800/70 flex items-center justify-between text-xs text-zinc-500">
      <span class="text-[11px] font-mono text-zinc-400">AY 2026–2027</span>
      <div class="flex items-center gap-1">
        <button
          onclick="UNIFIED_ROUTER.toggleTheme()"
          class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors"
          title="Toggle Theme"
        >
          <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>
        <button
          onclick="openResetModal()"
          class="p-1.5 rounded-lg text-zinc-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors"
          title="Reset"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ==========================================
       2. MAIN WORKSPACE WRAPPER
       ========================================== -->
  <div class="flex-1 flex flex-col md:pl-64 min-w-0 min-h-screen pb-16 md:pb-6">

    <!-- Top Minimal Breadcrumb App Bar -->
    <header class="sticky top-0 z-30 h-14 bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md border-b border-zinc-200/70 dark:border-zinc-800/70 px-4 sm:px-6 flex items-center justify-between">
      <div class="flex items-center gap-2.5 min-w-0">
        <!-- Mobile Sidebar Toggle -->
        <button
          onclick="UNIFIED_ROUTER.toggleMobileSidebar()"
          class="md:hidden p-2 -ml-2 rounded-lg text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 touch-target flex items-center justify-center"
          aria-label="Toggle courses menu"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
          </svg>
        </button>

        <!-- Dynamic Breadcrumb Trail -->
        <div id="header-breadcrumbs" class="flex items-center gap-1.5 text-xs font-mono truncate text-zinc-500">
          <span class="hover:text-zinc-900 dark:hover:text-zinc-100 cursor-pointer" onclick="UNIFIED_ROUTER.backToLanding()">Reviewer</span>
          <span>/</span>
          <span id="breadcrumb-course" class="text-zinc-900 dark:text-zinc-100 font-medium truncate">All Courses</span>
        </div>
      </div>

      <!-- Right Utility Actions -->
      <div class="flex items-center gap-1">
        <button
          onclick="window.print()"
          class="p-2 rounded-lg text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition-colors hidden sm:block"
          title="Print or Save PDF"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 w-full max-w-4xl mx-auto px-4 sm:px-6 py-5 sm:py-8">
      <!-- Landing View (Shown when no course is active) -->
      <section id="course-selector-view"></section>

      <!-- Active Content View (Populated dynamically) -->
      <section id="main-content" class="hidden"></section>
    </main>

  </div>

  <!-- ==========================================
       3. MOBILE BOTTOM SEGMENTED DOCK
       ========================================== -->
  <aside id="mobile-dock" class="md:hidden bottom-segmented-dock hidden">
    <div id="mobile-dock-inner" class="grid grid-cols-4 gap-1 w-full"></div>
  </aside>

  <!-- ==========================================
       RESET CONFIRMATION MODAL
       ========================================== -->
  <div id="reset-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/60 backdrop-blur-sm hidden animate-fade-in">
    <div class="w-full max-w-sm bg-white dark:bg-zinc-900 rounded-2xl p-5 border border-zinc-200 dark:border-zinc-800 shadow-xl space-y-4">
      <div class="space-y-1.5">
        <h3 class="text-base font-serif font-bold text-zinc-900 dark:text-zinc-100">Reset Study Progress</h3>
        <p class="text-xs text-zinc-500 leading-relaxed">Choose an exam scope or reset all local history.</p>
      </div>

      <div class="space-y-1.5 font-mono text-xs">
        <button onclick="confirmReset('cw')" class="w-full py-2 px-3 rounded-lg border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-800 text-left text-zinc-700 dark:text-zinc-300">
          Reset GEd 104 The Contemporary World
        </button>
        <button onclick="confirmReset('mobcom')" class="w-full py-2 px-3 rounded-lg border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-800 text-left text-zinc-700 dark:text-zinc-300">
          Reset CS 312 Mobile Computing
        </button>
        <button onclick="confirmReset('all')" class="w-full py-2 px-3 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-semibold text-left">
          Reset All Courses
        </button>
      </div>

      <div class="pt-2 border-t border-zinc-100 dark:border-zinc-800 flex justify-end">
        <button onclick="closeResetModal()" class="px-3 py-1.5 rounded-lg text-xs font-mono text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- ==========================================
       APPLICATION SCRIPTS
       ========================================== -->
  <script src="js/data/data-cw.js"></script>
  <script src="js/data/data-hci.js"></script>
  <script src="js/data/data-mobcom.js"></script>

  <script src="js/modules/mod-cw.js"></script>
  <script src="js/modules/mod-hci.js"></script>
  <script src="js/modules/mod-mobcom.js"></script>

  <script src="js/app.js"></script>

</body>
</html>
